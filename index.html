        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');

        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

function updateOverlayOpacity(val) {
    document.getElementById('opacity-val').innerText = Math.round(val * 100) + '%';
    map.eachLayer(function(layer) {
        if (layer instanceof L.ImageOverlay) {
            layer.setOpacity(val);
        } else if (layer.setStyle && layer.options && layer.options.fillOpacity !== 0) {
            layer.setStyle({ fillOpacity: val * 0.7, opacity: val });
        }
    });
}

document.getElementById('layer-opacity-slider').addEventListener('input', function(e) {
    updateOverlayOpacity(parseFloat(e.target.value));
});

function syncDynamicLegend() {

        var legendTable = label.querySelector('table');
        if (checkbox && legendTable) {
            legendTable.style.display = checkbox.checked ? 'table' : 'none';
        }
    });
}

});

function refreshCustomLegend() {
    var box = document.getElementById('custom-dynamic-legend');
    if (!box) return;
    var html = '';
    var labels = document.querySelectorAll('.leaflet-control-layers-overlays label');
    
    labels.forEach(function(lbl) {
        var cb = lbl.querySelector('input[type="checkbox"]');
        var text = lbl.innerText.trim();
        if (cb && cb.checked) {
            for (var key in legendData) {
                if (text.indexOf(key) !== -1) {
                    var info = legendData[key];
                    html += '<div style="font-weight:bold; margin:4px 0 6px 0; color:#111; border-bottom:1px solid #ddd; padding-bottom:3px;">' + info.title + '</div>';
                    info.items.forEach(function(it) {
                        html += '<div style="display:flex; align-items:center; margin-bottom:4px;">' +
                                '<span style="display:inline-block; width:14px; height:14px; background:' + it.color + '; border:1px solid #777; margin-right:8px; flex-shrink:0;"></span>' +
                                '<span style="color:#333;">' + it.label + '</span></div>';
                    });
                    break;
                }
            }
        }
    });

    if (html === '') {
        box.style.display = 'none';
    } else {
        box.style.display = 'block';
        box.innerHTML = html;
    }
}
